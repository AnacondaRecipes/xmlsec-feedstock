{% set name = "xmlsec" %}
{% set version = "1.3.17" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f3fac9ae679f66585925cc00c5f6839ae36c1d03157619571dee18acc05b9c01

build:
  number: 1
  skip: true  # [win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - pkg-config
  host:
    - python
    - libxml2 {{ libxml2 }}
    - libxmlsec1 {{ libxmlsec1 }}
    - lxml 6.1.1
    - pip
    - pkgconfig
    - setuptools
    - setuptools_scm
    - toml
    - wheel
  run:
    - python
    - lxml >=3.8.0

test:
  source_files:
    - tests
  imports:
    - xmlsec
  requires:
    - pip
    - pytest >=8.4.1
  commands:
    - pip check
    # Check that the correct version is reported by pip
    - "pip list --format json | grep '{\"name\": \"xmlsec\", \"version\": \"{{ version }}\"}'"
    # File test_xmlsec.py contains test that provokes a segmentation fault on re-initialization after shutdown, so we ignore it for now.
    # It will be reworked in a new version of xmlsec, fix is already merged in master:
    # https://github.com/xmlsec/python-xmlsec/pull/422/changes#diff-0d313532e38b5cceaf7873ee2bb5563e9fa2076b7d02073246b0ef75f6c0c612
    - pytest -vvv tests --ignore=tests/test_xmlsec.py

about:
  home: https://github.com/mehcode/python-xmlsec
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python bindings for the XML Security Library (XMLSec).
  description: |
    Python bindings for the XML Security Library (XMLSec).
  doc_url: https://xmlsec.readthedocs.io/
  dev_url: https://github.com/mehcode/python-xmlsec
